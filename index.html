.bg::after {
  content: ""; position: absolute; inset: 0;
  background:
    linear-gradient(to bottom, rgba(28,20,24,.62) 0%, rgba(28,20,24,.08) 26%, rgba(28,20,24,0) 48%, rgba(28,20,24,0) 70%, rgba(28,20,24,.5) 84%, rgba(28,20,24,.85) 100%);
}
main {
  position: relative; height: 100%;
  display: flex; flex-direction: column; justify-content: flex-start;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px max(10px, env(safe-area-inset-bottom, 0px));
  max-width: 560px; margin: 0 auto; box-sizing: border-box;
}
h1 {
  margin: 0; text-align: center;
  font-family: var(--font-display); font-weight: 700;
  font-size: clamp(3.2rem, 14vw, 4.6rem); line-height: 1;
  letter-spacing: .02em;
  text-shadow: 0 2px 18px rgba(0,0,0,.45);
  text-wrap: balance;
}
.moods {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  margin-top: auto;
}
.mood {
  --c: var(--rose);
  display: flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 50px; padding: 8px;
  border: 1px solid var(--glass-line); border-radius: 16px;
  background: var(--glass);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  color: var(--ink); font: inherit; font-size: 1.25rem;
  cursor: pointer;
  transition: transform .18s ease, background .18s ease, border-color .18s ease;
}
.mood::before {
  content: ""; width: 10px; height: 10px; border-radius: 50%;
  background: var(--c); box-shadow: 0 0 12px var(--c);
}
.mood:hover { background: rgba(50, 32, 40, .6); border-color: var(--c); }
.mood:active { transform: scale(.97); }
.mood:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.mood[data-k="sad"] { --c: var(--sad); }
.mood[data-k="happy"] { --c: var(--happy); }
.mood[data-k="angry"] { --c: var(--angry); }
.mood[data-k="miss"] { --c: var(--miss); }

/* note */
.scrim {
  position: fixed; inset: 0; z-index: 20;
  background: rgba(20, 12, 16, .55);
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  display: flex; align-items: flex-end; justify-content: center;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
  padding-top: max(24px, env(safe-area-inset-top, 0px));
  animation: fade .25s ease;
}
@media (min-width: 640px) { .scrim { align-items: center; } }
.note {
  --c: var(--rose);
  position: relative; width: 100%; max-width: 520px; max-height: 100%;
  box-sizing: border-box; overflow-y: auto;
  background: var(--paper); color: var(--paper-ink);
  border-radius: 22px; border-top: 6px solid var(--c);
  padding: 26px 22px 22px;
  box-shadow: 0 20px 60px rgba(0,0,0,.4);
  animation: rise .35s cubic-bezier(.2,.8,.2,1);
}
.note h2 {
  margin: 0 0 12px; font-family: var(--font-display); font-weight: 700;
  font-size: 2.6rem; line-height: 1; color: var(--c);
}
.note p {
  margin: 0; font-size: 1.08rem; line-height: 1.8; white-space: pre-line;
}
.close {
  margin-top: 20px; width: 100%; min-height: 48px;
  border: 0; border-radius: 14px; background: var(--c); color: #fff;
  font: inherit; font-size: 1.05rem; cursor: pointer;
}
.close:focus-visible { outline: 2px solid var(--paper-ink); outline-offset: 3px; }
.x {
  position: absolute; top: 12px; left: 12px;
  width: 36px; height: 36px; border: 0; border-radius: 50%;
  background: rgba(58,42,47,.08); color: var(--paper-ink);
  font-size: 1.2rem; cursor: pointer;
}
.more {
  margin-top: 8px; width: 100%; min-height: 42px;
  border: 1px dashed var(--glass-line); border-radius: 16px;
  background: rgba(34, 22, 28, .3);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  color: var(--ink-soft); font: inherit; font-size: 1rem; cursor: pointer;
}
.more:hover { color: var(--ink); border-color: var(--rose); }
.more:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.note.surprise { text-align: center; }
.note.surprise p { font-size: 1.5rem; line-height: 1.6; padding-block: 8px; }
.actions { display: flex; gap: 10px; margin-top: 20px; }
.actions .close { margin-top: 0; flex: 1; }
.again {
  flex: 1; min-height: 48px; border: 2px solid var(--c); border-radius: 14px;
  background: transparent; color: var(--c); font: inherit; font-size: 1.05rem; cursor: pointer;
}
.top-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.letters-btn {
  display: inline-flex; align-items: center; gap: 8px;
  min-height: 40px; padding: 6px 18px;
  border: 1px solid var(--glass-line); border-radius: 999px;
  background: var(--glass);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  color: var(--ink); font: inherit; font-size: 1rem; cursor: pointer;
}
.letters-btn:hover { border-color: var(--rose); }
.letters-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.letters-btn .badge {
  min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box;
  border-radius: 999px; background: var(--rose); color: #fff;
  font-size: .8rem; line-height: 20px; text-align: center;
}
.env-list { display: grid; gap: 10px; margin-top: 4px; }
.env {
  display: flex; align-items: center; gap: 14px; width: 100%;
  padding: 14px; box-sizing: border-box; text-align: right;
  border: 1px solid rgba(58,42,47,.14); border-radius: 16px;
  background: #fff; color: var(--paper-ink); font: inherit; cursor: pointer;
}
.env:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }
.env[aria-disabled="true"] { cursor: default; background: rgba(58,42,47,.04); }
.env .seal {
  flex: none; width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center; font-size: 1.3rem;
  background: var(--rose); color: #fff;
}
.env[aria-disabled="true"] .seal { background: rgba(58,42,47,.18); }
.env .meta { display: grid; gap: 2px; min-width: 0; }
.env .name { font-size: 1.1rem; }
.env .when { font-size: .9rem; opacity: .7; font-variant-numeric: tabular-nums; }
.back {
  flex: 1; min-height: 48px; border: 2px solid var(--c); border-radius: 14px;
  background: transparent; color: var(--c); font: inherit; font-size: 1.05rem; cursor: pointer;
}
.hearts { position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
.hearts span {
  position: absolute; bottom: -30px; color: var(--c, var(--rose)); font-size: 22px;
  animation: float 2.6s ease-out forwards;
}
@keyframes fade { from { opacity: 0 } }
@keyframes rise { from { transform: translateY(40px); opacity: 0 } }
@keyframes float { to { transform: translateY(-75vh) rotate(var(--r)); opacity: 0 } }
@media (prefers-reduced-motion: reduce) {
  .scrim, .note, .hearts span { animation: none !important; }
  .hearts { display: none; }
}
</style>
</head>
<body>


<div class="bg" aria-hidden="true"></div>
<main dir="rtl" lang="he">
  <h1>כשאת מרגישה...</h1>
  <div class="top-actions">
    <button class="letters-btn" id="letters-btn">✉ מכתב ממני <span class="badge" id="badge" hidden></span></button>
  </div>
  <div class="moods">
    <button class="mood" id="m-sad" data-k="sad">עצובה</button>
    <button class="mood" id="m-happy" data-k="happy">שמחה</button>
    <button class="mood" id="m-angry" data-k="angry">כועסת</button>
    <button class="mood" id="m-miss" data-k="miss">מתגעגעת</button>
  </div>
  <button class="more" id="more">ועוד משהו קטן ממני...</button>
</main>

<div class="scrim" id="scrim" hidden dir="rtl" lang="he">
  <div class="note" id="note" role="dialog" aria-modal="true" aria-labelledby="note-title">
    <button class="x" id="x" aria-label="סגירה">✕</button>
    <h2 id="note-title"></h2>
    <p id="note-text"></p>
    <div class="env-list" id="env-list" hidden></div>
    <div class="actions">
      <button class="again" id="again" hidden>עוד אחד</button>
      <button class="back" id="back" hidden>חזרה</button>
      <button class="close" id="close">❤️ סגירה</button>
    </div>
  </div>
</div>
<div class="hearts" id="hearts" aria-hidden="true"></div>

<script>
const notes = {
  sad: {
    title: "כשאת עצובה",
    color: "var(--sad)",
    text: "אני מקווה מאוד שלא תקראי את זה, כי בכל זאת אני מעדיף שלא תהיי עצובה. אבל אם את כבר קוראת את זה, אז הכי חשוב שתדעי, שאת הכי יפה כשאת מחייכת חיוך ענק❤️\n\nותזכרי שכמובן שאני תמיד בצד שלך, ואם את תצטרכי אותי, אני כמובן במרחק של שיחת טלפון אחת🥹\n\nאני אוהב אותך הכי בעולם, ואני בטוח שתצליחי להקסים את כולם שמה בצה״ל, בדיוק כמו שהצלחת להקסים אותי❤️ לא משנה מה יקרה אני תמיד אהיה גאה בך יפה שלי❤️"
  },
  happy: {
    title: "כשאת שמחה",
    color: "var(--happy)",
    text: "אני שמח לראות שאני לא צריך להזכיר לך לחייך כי את שמחה. והאמת, שאם את שמחה אז גם אני שמח💪\n\nיש כמה דברים שרציתי להגיד לך… אני זכיתי בבת זוג כמוך. ואני סומך עלייך שלא משנה מה יקרה את תמיד תמשיכי לחייך(עם שיניים!!!), כי אין על החיוך החמוד והיפה שלך. אני כל כך אוהב אותך ומתגעגע אלייך כל יום מחדש❤️\n\nבקיצור, תמשיכי לחייך ולשמוח, והכי חשוב, תמשיכי ליהנות מלאאאא❤️ אני סומך עלייך, גאה בך ואוהב אותך הכי בעולם💪❤️"
  },
  angry: {
    title: "כשאת כועסת",
    color: "var(--angry)",
    text: "דבר ראשון, אני מקווה שאת לא כועסת עליי… ואם כן, כנראה באמת שאני האידיוט בסיפור(מילים של יעל כמובן)😫\n\nלצורך הברכה, נקרא להוא שאת כועסת עליו רקסי(בכוונה זה שם של כלב). שתדעי שרקסי לא שווה את הכעס שלך, הוא סתם ערס שמן בתחת יש לו בן😃 אל תקחי ללב כלום ממה שרקסי אומר!!! הוא מכוער ומטומטם אם את כועסת עליו, ואת יפה, חכמה, צודקת ורזית.\n\nבקיצור, הפעם בלי צחוק… אני אוהב אותך הכי בעולם, ואם את צריכה שאני אעזור לך במשהו או סתם לדבר, אז תכתבי ותתקשרי אליי תמידדד❤️"
  },
  miss: {
    title: "כשאת מתגעגעת",
    color: "var(--miss)",
    text: "דבר ראשון והכי חשוב, גם אני מתגעגע אלייך יפה שלי🥹🥹🥹 אני אוהב אותך הכי בעולםםם, ואל תדאגי בקרוב את תחזרי הביתה ואני אתן לך חיבוק ענקקק❤️\n\nאבל עד אז תמשיכי לחייך את החיוך היפה שלך, ותנסי כמה שיותר ליהנות ולצחוק🫶🏽 גם אם מרגישה קצת אבודה(שזה לגיטימי לגמרי) תמיד תישארי אופטימית ושלמה עם עצמך❤️\n\nבכל דבר שתעשי, ובכל דרך שתבחרי, אני אהיה גאה בך ותמיד אשאר המעריץ מספר אחת שלך🫶🏽❤️"
  }
};

const surprises = [
  "אני אוהב אותךךךך❤️❤️❤️",
  "נכון שחברה שלי הכי טובה? אבל אל תגידי לה...",
  "אין על החיוך שלך🥹",
  "הכי חשוב שתהיי שלמה עם עצמך!!!",
  "אני אתן לך חיבוק ענקקק"
];
let lastSurprise = -1;
function pickSurprise() {
  let i;
  do { i = Math.floor(Math.random() * surprises.length); } while (i === lastSurprise && surprises.length > 1);
  lastSurprise = i;
  return surprises[i];
}

// מכתבים שנפתחים בתאריך (נפתחים בחצות לפי שעון ישראל)
const letters = [
  { date: "2026-10-28", name: "ליום הגיוס שלך", text: "האמת שקיוויתי שהיום הזה לא יגיע כל כך מהר, אבל הנה הוא כבר פה… קצת חששתי ממנו. פחדתי שיהיה לך קשה, שנתגעגע ושאולי אפילו נתרחק. אבל בחודשים האחרונים מאז שהכרתי אותך, גיליתי כמה את חזקה, חברותית, אכפתית ונחושה ללכת בדרך שלך. בזכות זה הבנתי כמה החששות שלי היו מופרכים. אני בטוח שנעבור כל אתגר, ואני יודע שאת הפרטנרית המושלמת לעבור את זה איתה. לא יכולתי לבקש בת זוג טובה יותר ממך, ובזכות השמחה והאור שאת מפיצה, אני יודע בוודאות שביחד נוכל לצלוח כל מכשול בדרך.\n\nכל יום את מצליחה להפתיע אותי לטובה מחדש עם הרגישות וחכמת החיים שלך, ואני בטוח במיליון אחוז שכל צה״ל יראה בך את מה שאני רואה בך. תכלס אין לך מה לדאוג… פשוט תהיי את, ואני בטוח שכולם יתאהבו בך בדיוק כמו שאני התאהבתי בך.\n\nתצאי לדרך הזו בראש מורם ובחיוך, כי את פשוט מושלמת כמו שאת. אני אוהב אותך, גאה בך הכי בעולם, ומחכה כבר לחיבוק בכל סוף שבוע." }
];
function todayIL() {
  try {
    return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Jerusalem", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
  } catch (e) {
    const d = new Date(); return d.toISOString().slice(0, 10);
  }
}
function daysUntil(iso) {
  const a = Date.parse(todayIL() + "T00:00:00Z"), b = Date.parse(iso + "T00:00:00Z");
  return Math.round((b - a) / 86400000);
}
function heDate(iso) { const [y, m, d] = iso.split("-"); return +d + "." + +m; }
function leftText(n) {
  if (n === 1) return "נפתח מחר";
  if (n === 2) return "נפתח בעוד יומיים";
  return "נפתח בעוד " + n + " ימים";
}
function renderBadge() {
  const open = letters.filter(l => daysUntil(l.date) <= 0).length;
  const b = document.getElementById("badge");
  b.textContent = open; b.hidden = open === 0;
}
renderBadge();

const scrim = document.getElementById("scrim");
const note = document.getElementById("note");
const hearts = document.getElementById("hearts");
let lastBtn = null;

function burst(color) {
  hearts.style.setProperty("--c", color);
  for (let i = 0; i < 14; i++) {
    const s = document.createElement("span");
    s.textContent = "❤";
    s.style.left = (5 + Math.random() * 90) + "%";
    s.style.fontSize = (14 + Math.random() * 18) + "px";
    s.style.animationDelay = (Math.random() * 0.5) + "s";
    s.style.setProperty("--r", (Math.random() * 60 - 30) + "deg");
    hearts.appendChild(s);
    setTimeout(() => s.remove(), 3400);
  }
}

function openNote(k, btn) {
  const n = notes[k];
  lastBtn = btn;
  resetNote();
  note.style.setProperty("--c", n.color);
  document.getElementById("note-title").textContent = n.title;
  document.getElementById("note-text").textContent = n.text;
  scrim.hidden = false;
  note.scrollTop = 0;
  document.getElementById("close").focus({ preventScroll: true });
  burst(n.color);
}
function openSurprise(btn) {
  lastBtn = btn;
  resetNote();
  note.classList.add("surprise");
  note.style.setProperty("--c", "var(--rose)");
  document.getElementById("note-title").textContent = "משהו קטן ממני";
  document.getElementById("note-text").textContent = pickSurprise();
  document.getElementById("again").hidden = false;
  scrim.hidden = false;
  document.getElementById("again").focus({ preventScroll: true });
  burst("var(--rose)");
}
function resetNote() {
  note.classList.remove("surprise");
  document.getElementById("again").hidden = true;
  document.getElementById("back").hidden = true;
  document.getElementById("env-list").hidden = true;
  document.getElementById("note-text").hidden = false;
}
function openLetters(btn) {
  if (btn) lastBtn = btn;
  resetNote();
  note.style.setProperty("--c", "var(--rose)");
  document.getElementById("note-title").textContent = "מכתב ממני";
  document.getElementById("note-text").hidden = true;
  const list = document.getElementById("env-list");
  list.innerHTML = "";
  letters.forEach((l, i) => {
    const n = daysUntil(l.date), open = n <= 0;
    const el = document.createElement("button");
    el.className = "env"; el.id = "env-" + i;
    el.setAttribute("aria-disabled", open ? "false" : "true");
    el.innerHTML = '<span class="seal">' + (open ? "💌" : "🔒") + '</span><span class="meta"><span class="name"></span><span class="when"></span></span>';
    el.querySelector(".name").textContent = l.name;
    el.querySelector(".when").textContent = heDate(l.date) + " · " + (open ? "אפשר לפתוח!" : leftText(n));
    el.addEventListener("click", () => { if (open) openLetter(l); });
    list.appendChild(el);
  });
  list.hidden = false;
  scrim.hidden = false;
  note.scrollTop = 0;
  document.getElementById("close").focus({ preventScroll: true });
}
function openLetter(l) {
  document.getElementById("env-list").hidden = true;
  document.getElementById("note-title").textContent = l.name;
  const p = document.getElementById("note-text");
  p.textContent = l.text.trim() || "המכתב הזה עוד בדרך אלייך... ❤️";
  p.hidden = false;
  document.getElementById("back").hidden = false;
  note.scrollTop = 0;
  burst("var(--rose)");
}
function closeNote() {
  scrim.hidden = true;
  if (lastBtn) lastBtn.focus();
}

document.querySelectorAll(".mood").forEach(b =>
  b.addEventListener("click", () => openNote(b.dataset.k, b)));
document.getElementById("more").addEventListener("click", e => openSurprise(e.currentTarget));
document.getElementById("again").addEventListener("click", () => {
  document.getElementById("note-text").textContent = pickSurprise();
  burst("var(--rose)");
});
document.getElementById("letters-btn").addEventListener("click", e => openLetters(e.currentTarget));
document.getElementById("back").addEventListener("click", () => openLetters());
document.getElementById("close").addEventListener("click", closeNote);
document.getElementById("x").addEventListener("click", closeNote);
scrim.addEventListener("click", e => { if (e.target === scrim) closeNote(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !scrim.hidden) closeNote(); });
</script>

</body>
</html>
